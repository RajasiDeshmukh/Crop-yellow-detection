<svg width="900" height="180" xmlns="http://www.w3.org/2000/svg">

<style>
.box { fill:#eef2ff; stroke:#1e293b; stroke-width:2; rx:8; }
.text { font-family:Arial; font-size:13px; fill:#1e293b; text-anchor:middle; dominant-baseline:middle; }
.arrow { stroke:#1e293b; stroke-width:2; marker-end:url(#arrowhead); }
</style>

<defs>
<marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
<polygon points="0 0, 10 3.5, 0 7" fill="#1e293b"></polygon>
</marker>
</defs>

<!-- Boxes -->

<rect class="box" x="20" y="60" width="150" height="50"></rect>
<text class="text" x="95" y="85">Capture UAV Image</text>

<rect class="box" x="200" y="60" width="160" height="50"></rect>
<text class="text" x="280" y="85">Run yellow_detection.py</text>

<rect class="box" x="390" y="60" width="170" height="50"></rect>
<text class="text" x="475" y="85">Extract Pixel Coordinates</text>

<rect class="box" x="590" y="60" width="170" height="50"></rect>
<text class="text" x="675" y="85">pixel_to_gps.py</text>

<rect class="box" x="790" y="60" width="170" height="50"></rect>
<text class="text" x="875" y="85">Generate Geotag Output</text>

<!-- Arrows -->

<line class="arrow" x1="170" y1="85" x2="200" y2="85"></line>
<line class="arrow" x1="360" y1="85" x2="390" y2="85"></line>
<line class="arrow" x1="560" y1="85" x2="590" y2="85"></line>
<line class="arrow" x1="760" y1="85" x2="790" y2="85"></line>

</svg>