<svg width="800" height="420" xmlns="http://www.w3.org/2000/svg">

<style>
.box { fill:#f5f7fb; stroke:#2c3e50; stroke-width:2; rx:8; }
.text { font-family:Arial; font-size:14px; fill:#2c3e50; text-anchor:middle; dominant-baseline:middle; }
.arrow { stroke:#2c3e50; stroke-width:2; marker-end:url(#arrowhead); }
</style>

<defs>
<marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
<polygon points="0 0, 10 3.5, 0 7" fill="#2c3e50"></polygon>
</marker>
</defs>

<!-- Boxes -->
<rect class="box" x="250" y="20" width="300" height="50"></rect>
<text class="text" x="400" y="45">Drone Camera Frame</text>

<rect class="box" x="250" y="100" width="300" height="50"></rect>
<text class="text" x="400" y="125">Yellow Marker Detection</text>

<rect class="box" x="250" y="180" width="300" height="50"></rect>
<text class="text" x="400" y="205">Pixel Coordinate Extraction</text>

<rect class="box" x="250" y="260" width="300" height="50"></rect>
<text class="text" x="400" y="285">Pixel-to-GPS Conversion</text>

<rect class="box" x="250" y="340" width="300" height="50"></rect>
<text class="text" x="400" y="365">Geotagged Target Location</text>

<!-- Arrows -->
<line class="arrow" x1="400" y1="70" x2="400" y2="100"></line>
<line class="arrow" x1="400" y1="150" x2="400" y2="180"></line>
<line class="arrow" x1="400" y1="230" x2="400" y2="260"></line>
<line class="arrow" x1="400" y1="310" x2="400" y2="340"></line>

</svg>